{% load static %}
<div id="intro" class="intro" role="presentation" hidden>
  <div class="intro-bg" id="intro-bg"></div>
  <div class="intro-stage">
    <div class="intro-shadow" id="intro-shadow"></div>
    <div class="intro-logo" id="intro-logo" data-src="{% static 'certificates/img/certify-mark.svg' %}"></div>
    <svg class="intro-plane" id="intro-plane" viewBox="0 0 48 40" width="54" height="45" aria-hidden="true">
      <path d="M2 18 L46 2 L30 38 L22 24 Z" fill="#fff" stroke="#9fb4e8" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M22 24 L46 2 L26 27 Z" fill="#c9d6f5"/>
      <path d="M22 24 L25 36 L30 38 Z" fill="#9fb4e8"/>
    </svg>
  </div>
  <button type="button" class="intro-skip" id="intro-skip">Skip</button>
</div>
<style>
  .intro { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .intro[hidden] { display: none; }
  .intro-bg { position: absolute; inset: 0; background: var(--ink-900, #0a1020); }
  .intro-stage { position: relative; width: 100%; height: 100%; perspective: 700px; }
  .intro-logo { position: absolute; left: 50%; top: 50%; width: 150px; height: 130px; margin: -65px 0 0 -75px; z-index: 2; will-change: transform; transform-style: preserve-3d; }
  .intro-logo img { position: absolute; left: 0; top: 0; backface-visibility: visible; }
  .intro-shadow { position: absolute; left: 50%; top: 50%; width: 120px; height: 18px; margin: 95px 0 0 -60px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent); z-index: 1; will-change: transform, opacity; }
  .intro-logo img { width: 100%; height: 100%; display: block; }
  .intro-plane { position: absolute; left: 0; top: 0; z-index: 3; will-change: transform; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .intro-skip { position: absolute; right: 16px; bottom: 16px; z-index: 4; padding: 10px 18px; min-height: 44px; border-radius: 999px; border: 1px solid var(--ink-border, #24324f); background: transparent; color: var(--text-hi, #c9d3ea); font: inherit; cursor: pointer; }
</style>
<script>
(function () {
  var box = document.getElementById('intro');
  if (!box) return;
  var seen = false;
  try { seen = sessionStorage.getItem('certify-intro') === '1'; } catch (e) {}
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (seen || reduce) { box.remove(); return; }
  try { sessionStorage.setItem('certify-intro', '1'); } catch (e) {}
  box.hidden = false;

  var logo = document.getElementById('intro-logo'), plane = document.getElementById('intro-plane'), bg = document.getElementById('intro-bg');
  // a thick, solid-looking logo: a stack of copies pushed back in depth, darker towards the back
  var src = logo.getAttribute('data-src'), LAYERS = 12;
  for (var i = LAYERS - 1; i >= 0; i--) {
    var im = document.createElement('img');
    im.src = src; im.alt = ''; im.width = 150; im.height = 130; im.setAttribute('aria-hidden', 'true');
    im.style.transform = 'translateZ(' + (-i * 1.5) + 'px)';
    if (i > 0) im.style.filter = 'brightness(' + (0.72 - i * 0.025) + ') saturate(.9)';
    logo.appendChild(im);
  }
  var shadow = document.getElementById('intro-shadow');
  var W = window.innerWidth, H = window.innerHeight, cx = W / 2, cy = H / 2;
  var rx = Math.min(W * 0.34, 160), ry = rx * 0.38;
  var IN = 700, ORBIT = 1200, LAND = 900, TOTAL = IN + ORBIT + LAND;   // 2.8 s
  var A0 = Math.PI * 0.85, P0 = { x: -70, y: H * 0.22 };
  var start = performance.now(), finished = false, raf = 0;

  // where the real logo sits in the top-left of the page (the plane lands on it)
  var target = { x: 60, y: 36, size: 56 };
  var real = Array.prototype.filter.call(document.querySelectorAll('.brand-logo'), function (n) { return n.offsetParent !== null; })[0];
  if (real) {
    var r = real.getBoundingClientRect();
    if (r.width) target = { x: r.left + r.width * 0.14, y: r.top + r.height * 0.5, size: r.height * 0.95 };
  }

  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function orbit(a) {
    var tilt = -0.28, x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    return { x: cx + x * Math.cos(tilt) - y * Math.sin(tilt), y: cy + x * Math.sin(tilt) + y * Math.cos(tilt), z: Math.sin(a) };
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function planeAt(t) {                                   // position of the plane at time t (ms)
    if (t < IN) {
      var u = ease(t / IN), e = orbit(A0);
      return { x: lerp(P0.x, e.x, u), y: lerp(P0.y, e.y, u) - Math.sin(u * Math.PI) * 60, z: 0.6, k: 1 };
    }
    if (t < IN + ORBIT) { var o = orbit(A0 + ((t - IN) / ORBIT) * Math.PI * 2); return { x: o.x, y: o.y, z: o.z, k: 1 }; }
    var v = ease((t - IN - ORBIT) / LAND), st = orbit(A0 + Math.PI * 2);
    return { x: lerp(st.x, target.x + target.size * 0.28, v), y: lerp(st.y, target.y - target.size * 0.28, v) - Math.sin(v * Math.PI) * 50, z: 1, k: 1 - 0.55 * v };
  }
  function frame(now) {
    if (finished) return;
    var t = now - start;
    if (t >= TOTAL) return finish();
    var p = planeAt(t), q = planeAt(Math.min(t + 40, TOTAL));
    var s = 0.75 + 0.35 * ((p.z + 1) / 2);
    plane.style.transform = 'translate(' + (p.x - 27) + 'px,' + (p.y - 22) + 'px) rotate(' + (Math.atan2(q.y - p.y, q.x - p.x) + 0.1) + 'rad) scale(' + (s * p.k) + ')';
    plane.style.zIndex = p.z < 0 ? 1 : 3;
    plane.style.opacity = t > TOTAL - 180 ? Math.max((TOTAL - t) / 180, 0) : (p.z < 0 ? 0.8 : 1);

    var sec = t / 1000, e = t > IN + ORBIT ? ease((t - IN - ORBIT) / LAND) : 0;
    var wob = 1 - e;                                        // the 3D float calms down as the logo flies up-left
    var kO = Math.min(Math.max((t - IN) / ORBIT, 0), 1), spin = 360 * ease(kO), sc = lerp(1, target.size / 130, e);
    logo.style.transform = 'translate(' + ((target.x - cx) * e) + 'px,' + ((target.y - cy) * e + Math.sin(sec * 5) * 9 * wob) + 'px) scale(' + sc + ') rotateY(' + (spin + Math.sin(sec * 3.2) * 18 * wob) + 'deg) rotateX(' + (Math.cos(sec * 4) * 10 * wob) + 'deg)';
    shadow.style.transform = 'scale(' + (1 - Math.sin(sec * 5) * 0.12 * wob) + ')';
    shadow.style.opacity = wob;
    bg.style.opacity = e > 0.4 ? Math.max(1 - (e - 0.4) / 0.6, 0) : 1;   // reveal the page while the logo lands
    raf = requestAnimationFrame(frame);
  }
  function finish() {
    if (finished) return;
    finished = true; cancelAnimationFrame(raf);
    box.remove();
    if (real && real.animate) real.animate([{ transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' });
  }
  document.getElementById('intro-skip').addEventListener('click', finish);
  box.addEventListener('click', finish);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') finish(); });
  raf = requestAnimationFrame(frame);
})();
</script>
