{% load static %}
<div id="intro" class="intro" role="presentation" hidden>
  <div class="intro-stage">
    <div class="intro-logo" id="intro-logo"><img src="{% static 'certificates/img/certify-mark.svg' %}" alt="" width="150" height="130"></div>
    <svg class="intro-plane" id="intro-plane" viewBox="0 0 48 40" width="54" height="45" aria-hidden="true">
      <path d="M2 18 L46 2 L30 38 L22 24 Z" fill="#fff" stroke="#9fb4e8" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M22 24 L46 2 L26 27 Z" fill="#c9d6f5"/>
      <path d="M22 24 L25 36 L30 38 Z" fill="#9fb4e8"/>
    </svg>
  </div>
  <button type="button" class="intro-skip" id="intro-skip">Skip</button>
</div>
<style>
  .intro { position: fixed; inset: 0; z-index: 2000; background: var(--ink-900, #0a1020); display: flex; align-items: center; justify-content: center; overflow: hidden; transition: opacity .35s ease; }
  .intro[hidden] { display: none; }
  .intro.out { opacity: 0; pointer-events: none; }
  .intro-stage { position: relative; width: 100%; height: 100%; perspective: 700px; }
  .intro-logo { position: absolute; left: 50%; top: 50%; width: 150px; height: 130px; margin: -65px 0 0 -75px; z-index: 2; will-change: transform; transform-style: preserve-3d; filter: drop-shadow(0 18px 18px rgba(0,0,0,.35)); }
  .intro-logo img { width: 100%; height: 100%; display: block; }
  .intro-plane { position: absolute; left: 0; top: 0; z-index: 3; will-change: transform; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .intro-skip { position: absolute; right: 16px; bottom: 16px; z-index: 4; padding: 10px 18px; min-height: 44px; border-radius: 999px; border: 1px solid var(--ink-border, #24324f); background: transparent; color: var(--text-hi, #c9d3ea); font: inherit; cursor: pointer; }
</style>
<script>
(function () {
  var box = document.getElementById('intro');
  if (!box) return;
  var seen = false;
  try { seen = sessionStorage.getItem('certify-intro') === '1'; } catch (e) {}
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (seen || reduce) { box.remove(); return; }
  try { sessionStorage.setItem('certify-intro', '1'); } catch (e) {}
  box.hidden = false;

  var logo = document.getElementById('intro-logo'), plane = document.getElementById('intro-plane');
  var W = window.innerWidth, H = window.innerHeight;
  var cx = W / 2, cy = H / 2;
  var rx = Math.min(W * 0.36, 170), ry = rx * 0.38;      // orbit ellipse (depth: ry is the "front/back" swing)
  var TOTAL = 3000, IN = 800, ORBIT = 1500;               // ms: fly in, one lap, fly out
  var start = performance.now(), finished = false, raf = 0;

  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function orbit(a) {                                     // a: angle, 0 = right, +90deg = in front of the logo
    var tilt = -0.28;
    var x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    return { x: cx + x * Math.cos(tilt) - y * Math.sin(tilt), y: cy + x * Math.sin(tilt) + y * Math.cos(tilt), z: Math.sin(a) };
  }
  var A0 = Math.PI * 0.85;                                // where the lap begins (left side)
  var P0 = { x: -70, y: H * 0.22 };                       // enter from off-screen left
  var P1 = { x: W + 80, y: H * 0.12 };                    // leave to the upper right

  function place(p, heading, z) {
    var s = 0.75 + 0.35 * ((z + 1) / 2);
    plane.style.transform = 'translate(' + (p.x - 27) + 'px,' + (p.y - 22) + 'px) rotate(' + heading + 'rad) scale(' + s + ')';
    plane.style.zIndex = z < 0 ? 1 : 3;                   // behind the logo on the far side of the orbit
    plane.style.opacity = z < 0 ? 0.8 : 1;
  }
  function frame(now) {
    if (finished) return;
    var t = now - start;
    if (t >= TOTAL) return finish();
    var p, ahead, z = 1;
    if (t < IN) {                                         // fly in along a curve to the lap start
      var u = ease(t / IN), end = orbit(A0);
      p = { x: P0.x + (end.x - P0.x) * u, y: P0.y + (end.y - P0.y) * u + Math.sin(u * Math.PI) * -60 };
      var u2 = Math.min(u + 0.03, 1);
      ahead = { x: P0.x + (end.x - P0.x) * u2, y: P0.y + (end.y - P0.y) * u2 + Math.sin(u2 * Math.PI) * -60 };
      z = 0.6;
    } else if (t < IN + ORBIT) {                          // one full lap around the logo
      var k = (t - IN) / ORBIT, a = A0 + k * Math.PI * 2;
      p = orbit(a); ahead = orbit(a + 0.06); z = p.z;
    } else {                                              // leave, sweeping off the top right
      var v = ease((t - IN - ORBIT) / (TOTAL - IN - ORBIT)), st = orbit(A0 + Math.PI * 2);
      p = { x: st.x + (P1.x - st.x) * v, y: st.y + (P1.y - st.y) * v - Math.sin(v * Math.PI) * 40 };
      var v2 = Math.min(v + 0.03, 1);
      ahead = { x: st.x + (P1.x - st.x) * v2, y: st.y + (P1.y - st.y) * v2 - Math.sin(v2 * Math.PI) * 40 };
      z = 1;
    }
    place(p, Math.atan2(ahead.y - p.y, ahead.x - p.x) + 0.1, z);
    // the logo floats up and down and turns a little, so it looks like a 3D object
    var s = t / 1000;
    logo.style.transform = 'translateY(' + (Math.sin(s * 5) * 9) + 'px) rotateY(' + (Math.sin(s * 3.2) * 22) + 'deg) rotateX(' + (Math.cos(s * 4) * 8) + 'deg)';
    raf = requestAnimationFrame(frame);
  }
  function finish() {
    if (finished) return;
    finished = true; cancelAnimationFrame(raf);
    box.classList.add('out');
    setTimeout(function () { box.remove(); }, 400);
  }
  document.getElementById('intro-skip').addEventListener('click', finish);
  box.addEventListener('click', finish);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') finish(); });
  raf = requestAnimationFrame(frame);
})();
</script>
