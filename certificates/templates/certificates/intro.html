<div id="intro" class="intro" aria-hidden="true" hidden>
  <svg class="intro-trail" id="intro-trail" width="100%" height="100%"><path id="intro-trail-path" d="" fill="none" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 11"/></svg>
  <svg class="intro-plane" id="intro-plane" viewBox="0 0 48 40"><path d="M2 18 L46 2 L30 38 L22 24 Z" fill="#fff" stroke="#9fb4e8" stroke-width="2" stroke-linejoin="round"/><path d="M22 24 L46 2 L26 27 Z" fill="#c9d6f5"/><path d="M22 24 L25 36 L30 38 Z" fill="#9fb4e8"/></svg>
</div>
<style>
  .intro { position: fixed; inset: 0; z-index: 2000; pointer-events: none; overflow: hidden; }
  .intro[hidden] { display: none; }
  .intro-trail { position: absolute; inset: 0; width: 100%; height: 100%; }
  .intro-plane { position: absolute; left: 0; top: 0; will-change: transform; filter: drop-shadow(0 8px 8px rgba(0,0,0,.4)); }
</style>
<script>
(function () {
  // One paper plane: it flies big across the whole page leaving a dashed line, shrinks as it nears the
  // logo at the top-left, joins the logo and keeps circling it (the header takes over at the end).
  var box = document.getElementById('intro');
  if (!box) return;
  var seen = false;
  try { seen = sessionStorage.getItem('certify-intro') === '1'; } catch (e) {}
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (seen || reduce) { box.remove(); return; }
  try { sessionStorage.setItem('certify-intro', '1'); } catch (e) {}
  window.certifyIntro = true;          // tells the header to keep its own plane hidden until we arrive
  box.hidden = false;

  var plane = document.getElementById('intro-plane'), trail = document.getElementById('intro-trail-path');
  var TOTAL = 3000, FADE = 600;
  var W = window.innerWidth, H = window.innerHeight;
  var pts = [], first = true, start = 0, finished = false, tg = null, A0 = 0, P = null;

  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function bez(p0, p1, p2, p3, t) {
    var u = 1 - t;
    return { x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x, y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y };
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function angDiff(a, b) { var d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }

  function setup() {
    tg = window.certifyOrbitState ? window.certifyOrbitState(A0) : { vx: 50, vy: 40, head: 0, size: 18, sc: 1 };
    var S = { x: -90, y: H * 0.82 }, M = { x: W * 0.86, y: H * 0.55 };
    P = {
      a: [S, { x: W * 0.22, y: H * 0.25 }, { x: W * 0.55, y: H * 1.0 }, M],
      b: [M, { x: W * 1.02, y: H * 0.05 }, { x: W * 0.5, y: -H * 0.02 }, { x: tg.vx, y: tg.vy }]
    };
    P.s0 = Math.min(110, W * 0.26) / tg.size;                   // start scale: a big plane
  }
  function at(u) {                                              // position along the whole route, u in 0..1
    return u < 0.5 ? bez(P.a[0], P.a[1], P.a[2], P.a[3], u / 0.5) : bez(P.b[0], P.b[1], P.b[2], P.b[3], (u - 0.5) / 0.5);
  }
  function frame(now) {
    if (finished) return;
    if (first) { first = false; start = now; setup(); }
    var t = now - start;
    if (t >= TOTAL) return finish();
    var u = ease(Math.min(t / (TOTAL - 250), 1)) * 0.5 + Math.min(t / (TOTAL - 250), 1) * 0.5;   // gentle ease, keeps speed
    u = Math.min(u, 1);
    var p = at(u), q = at(Math.min(u + 0.01, 1));
    var head = Math.atan2(q.y - p.y, q.x - p.x);
    var k = Math.max((u - 0.82) / 0.18, 0);                      // last stretch: line up with the orbit
    head += angDiff(head, tg.head) * ease(k);
    var sc = lerp(P.s0, tg.sc, Math.pow(u, 0.7));                // shrinks as it travels
    plane.style.width = tg.size + 'px';
    plane.style.transform = 'translate(' + (p.x - tg.size / 2) + 'px,' + (p.y - tg.size * 0.42) + 'px) rotate(' + head + 'rad) scale(' + sc + ')';
    pts.push((pts.length ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1));
    trail.setAttribute('d', pts.join(' '));
    trail.style.opacity = t > TOTAL - FADE ? Math.max((TOTAL - t) / FADE, 0) : 1;
    requestAnimationFrame(frame);
  }
  function finish() {
    if (finished) return;
    finished = true;
    if (window.certifyOrbitStart) window.certifyOrbitStart(A0);  // the header's plane takes over from here
    window.certifyIntro = false;
    box.remove();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') finish(); });
  requestAnimationFrame(frame);
})();
</script>
